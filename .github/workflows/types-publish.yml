name: Publish valorant-api-types package to npmjs
on:
  push:
    tags:
      - v*
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./valorant-api-types
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      # The repo root is an npm workspace without a committed lockfile, so install from this package's own lockfile
      - run: npm ci --workspaces=false
      - run: npm publish --provenance --access public --foreground-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}