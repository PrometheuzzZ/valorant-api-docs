name: Types Test
on:
  push:
  pull_request:
jobs:
  build:
    defaults:
      run:
        working-directory: valorant-api-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Use Node.js 20.x'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # The repo root is an npm workspace without a committed lockfile, so install from this package's own lockfile
      - run: npm ci --workspaces=false
      - run: npm test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Use Node.js 20.x'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # Mirrors the Vercel build (see vercel.json): install the workspaces from the root, then build the site
      - run: npm install
      - run: npm run build
        working-directory: web
      - run: npm run generate-docs
        working-directory: web
        env:
          DOCS_DIR: ${{ runner.temp }}/docs
